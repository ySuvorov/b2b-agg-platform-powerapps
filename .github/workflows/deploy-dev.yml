# ============================================================
# deploy-dev.yml
# Pack the solution from source and import it into B2BAgg-Dev.
#
# Triggers:
#   • Manual: workflow_dispatch (on-demand deploy from any branch)
#   • Automatic: push to main that touches solutions/**
#
# Auth: GitHub OIDC + Microsoft Entra Federated Identity Credentials (FIC).
# No client secret — the powerplatform-actions exchange the GitHub OIDC token
# for an Entra access token (needs `id-token: write` + the FIC `gh-*` records on
# the b2bagg-github-actions app registration).
#
# Required secrets:
#   PP_CLIENT_ID  — Azure AD App Registration (client) ID
#   PP_TENANT_ID  — Entra tenant ID
#   PP_DEV_URL    — Dev environment URL (https://YOUR-DATAVERSE-ORG.crm.dynamics.com/)
# ============================================================

name: Deploy → Dev

on:
  workflow_dispatch:
    # Allows triggering manually from the Actions tab, useful for
    # deploying a feature branch for review before it merges.

  push:
    branches:
      - main
    paths:
      - 'solutions/**'   # only deploy when solution source changes

# One deploy to Dev at a time; cancel any stale queued run on the same branch.
concurrency:
  group: deploy-dev-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write       # exchange the GitHub OIDC token for an Entra token (FIC)
  contents: read
  deployments: write    # needed to create GitHub deployment statuses

jobs:
  deploy:
    name: Pack & Import into Dev
    runs-on: ubuntu-latest

    # GitHub Environments let you add required reviewers or wait-timers later.
    environment:
      name: dev
      url: https://YOUR-DATAVERSE-ORG.crm.dynamics.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the pac CLI on the runner. Pin a pac version that supports
      # OIDC/FIC auth. (The macOS 1.52.1 pin is a local-only MSAL workaround and
      # does not apply to the Linux runner.)
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Pack the solution source into a zip. Offline — no auth needed.
      - name: Pack solution from source
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/B2BAgg.Core/src
          solution-file: /tmp/B2BAgg_Core.zip
          solution-type: Unmanaged

      # Import via the marketplace action: OIDC/FIC auth (app-id + tenant-id, no
      # secret), synchronous, force-overwrite to match the prior pac behaviour.
      - name: Import solution into Dev (OIDC)
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.PP_DEV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: /tmp/B2BAgg_Core.zip
          force-overwrite: true
          activate-plugins: true
          run-asynchronously: false

      - name: Create GitHub deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const state = jobStatus === 'success' ? 'success' : 'failure';
            const desc  = state === 'success'
              ? 'B2BAgg_Core imported into Dev successfully.'
              : 'Import into Dev failed — check the Actions log.';

            // Create a deployment record pointing at the current SHA.
            const deploy = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   context.sha,
              environment: 'dev',
              description: 'B2BAgg Core solution',
              auto_merge: false,
              required_contexts: [],
            });

            await github.rest.repos.createDeploymentStatus({
              owner:         context.repo.owner,
              repo:          context.repo.repo,
              deployment_id: deploy.data.id,
              state,
              description:   desc,
              environment_url: 'https://YOUR-DATAVERSE-ORG.crm.dynamics.com/',
              log_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            });
