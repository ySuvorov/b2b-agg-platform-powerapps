# ============================================================
# pr-validation.yml
# Runs on every PR targeting main.
#
# Auth: GitHub OIDC + Microsoft Entra Federated Identity Credentials (FIC) —
# no client secret (P3 OIDC flip, audit M-3). Runs on pull_request; relies on
# the FIC `gh-pr` subject (repo:…:pull_request).
#
# Required GitHub Actions secrets:
#   PP_CLIENT_ID  — Azure AD App Registration (client) ID
#   PP_TENANT_ID  — Entra tenant: <tenant-id>
#   PP_DEV_URL    — Dev environment URL (https://YOUR-DATAVERSE-ORG.crm.dynamics.com/)
# ============================================================

name: PR Validation

on:
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same PR branch to save runner minutes.
concurrency:
  group: pr-validation-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  id-token: write       # exchange the GitHub OIDC token for an Entra token (FIC)
  contents: read
  pull-requests: write  # needed for posting the summary comment

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Pack solution XML and run the Power Platform Checker
  # ────────────────────────────────────────────────────────────
  solution-check:
    name: Solution Pack & Checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Pack the solution source into a zip. Offline — no auth needed.
      - name: Pack solution from source
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/B2BAgg.Core/src
          solution-file: /tmp/B2BAgg_Core.zip
          solution-type: Unmanaged

      # Solution Checker via the marketplace action: authenticates with OIDC/FIC
      # (app-id + tenant-id, no secret) and uploads its logs as an artifact.
      # fail-on-analysis-error defaults to true, so this stays a real gate.
      - name: Run Power Platform Solution Checker (OIDC)
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          path: /tmp/B2BAgg_Core.zip
          environment-url: ${{ secrets.PP_DEV_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          checker-logs-artifact-name: solution-checker-results-${{ github.run_number }}

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Lint Python scripts and build the Buyer Code App
  # ────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Run in parallel with solution-check; independent validation track.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python checks ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install seed-script dependencies (if requirements file exists)
        run: |
          if [ -f scripts/requirements-seed.txt ]; then
            pip install -r scripts/requirements-seed.txt -q
          else
            echo "No requirements-seed.txt found — skipping."
          fi

      - name: Syntax-check seed data script
        run: |
          if [ -f scripts/seed-dev-data.py ]; then
            python -m py_compile scripts/seed-dev-data.py
            echo "seed-dev-data.py: OK"
          else
            echo "scripts/seed-dev-data.py not found — skipping."
          fi

      - name: Install Azure Function dependencies
        run: |
          if [ -f azure/functions/requirements.txt ]; then
            pip install -r azure/functions/requirements.txt -q
          fi
          pip install pytest -q

      - name: Compile Azure Function (canonical entrypoints)
        # Canonical v2 model: function_app.py + sku_matcher.py (Codex #7).
        run: |
          python -m py_compile azure/functions/function_app.py
          python -m py_compile azure/functions/sku_matcher.py
          echo "function_app.py + sku_matcher.py: OK"

      - name: Run SKU matcher tests
        run: |
          if ls azure/functions/test_*.py >/dev/null 2>&1; then
            pytest azure/functions -q
          else
            echo "No azure/functions/test_*.py yet (added in P4) — skipping."
          fi

      # ── Node / Buyer Code App ──────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: apps/buyer-code-app/package-lock.json

      - name: Lint & build Buyer Code App (React + Vite)
        # Real gate (audit P1-1): no continue-on-error. Lint must pass and the
        # production build must succeed.
        working-directory: apps/buyer-code-app
        run: |
          npm ci
          npm run lint
          npm run build

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Post a summary comment to the PR
  # Runs after both jobs above, regardless of their outcome.
  # ────────────────────────────────────────────────────────────
  post-summary:
    name: Post PR Summary Comment
    runs-on: ubuntu-latest
    needs: [solution-check, lint-and-test]
    if: always()  # run even when upstream jobs fail

    steps:
      - name: Post check summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const solutionResult = '${{ needs.solution-check.result }}';
            const lintResult     = '${{ needs.lint-and-test.result }}';

            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const body = [
              '## CI Validation Summary',
              '',
              '| Check | Result |',
              '|---|---|',
              `| Solution Pack & Checker | ${icon(solutionResult)} \`${solutionResult}\` |`,
              `| Lint & Build | ${icon(lintResult)} \`${lintResult}\` |`,
              '',
              `> Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · \`${{ github.sha }}\``,
            ].join('\n');

            // Find an existing bot comment so we update rather than spam.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const prev = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CI Validation Summary')
            );

            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
