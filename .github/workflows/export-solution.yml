# ============================================================
# export-solution.yml
# Manual workflow: export the latest B2BAgg_Core solution from
# a Power Platform environment, unpack it, and commit back to main.
#
# Use this after making changes directly in the PP UI (forms,
# views, BPF tweaks) so the solution source stays in sync.
#
# Auth: GitHub OIDC + Microsoft Entra Federated Identity Credentials (FIC) —
# no client secret (P3 OIDC flip, audit M-3). Runs on main; relies on the FIC
# `gh-main` subject (repo:…:ref:refs/heads/main).
#
# Required secrets:
#   PP_CLIENT_ID  — Azure AD App Registration (client) ID
#   PP_TENANT_ID  — Entra tenant ID
#   PP_DEV_URL    — Dev environment URL
#   PP_TEST_URL   — Test environment URL
# ============================================================

name: Export Solution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Source environment to export from'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
      managed:
        description: 'Export as managed solution?'
        required: true
        type: boolean
        default: false

# Only one export at a time per branch — prevents conflicting commits.
concurrency:
  group: export-solution-${{ github.ref_name }}
  cancel-in-progress: false  # let exports finish rather than abort mid-commit

permissions:
  id-token: write        # exchange the GitHub OIDC token for an Entra token (FIC)
  contents: write        # push the bot export branch
  pull-requests: write   # open the review PR (audit P2-4)

jobs:
  export:
    name: Export & Unpack B2BAgg_Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN so the push at the end is authorised.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Resolve the correct URL based on the selected environment input.
      - name: Resolve environment URL
        id: env-url
        run: |
          if [ "${{ inputs.environment }}" = "test" ]; then
            echo "url=${{ secrets.PP_TEST_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.PP_DEV_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare export directory
        run: mkdir -p /tmp/export

      # Export via the marketplace action: OIDC/FIC auth (app-id + tenant-id, no
      # secret). `managed` comes from the workflow_dispatch input.
      - name: Export solution from Power Platform (OIDC)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ steps.env-url.outputs.url }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: B2BAgg_Core
          solution-output-file: /tmp/export/B2BAgg_Core.zip
          managed: ${{ inputs.managed }}

      # Unpack into the source tree. NOTE: the marketplace unpack-solution has no
      # equivalent of the old `pac ... --allowDelete`, so components deleted in
      # the source environment are not pruned from the tree automatically
      # (overwrite-files defaults to true, so updates/additions still land).
      # Tracked as a follow-up.
      - name: Unpack solution into source tree
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: /tmp/export/B2BAgg_Core.zip
          solution-folder: solutions/B2BAgg.Core/src
          solution-type: Unmanaged

      # Open a PR from a dedicated bot branch instead of pushing straight to the
      # checked-out branch / main (audit P2-4, Codex #5). Keeps main protected
      # and lets exported schema drift be reviewed before it lands.
      - name: Open PR with exported changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- solutions/B2BAgg.Core/src; then
            echo "No solution changes detected — nothing to PR."
            exit 0
          fi

          BRANCH="chore/export-${{ inputs.environment }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add solutions/B2BAgg.Core/src
          git commit -m "chore: export B2BAgg_Core from ${{ inputs.environment }} [skip ci]"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: export B2BAgg_Core from ${{ inputs.environment }}" \
            --body "Automated solution export from **${{ inputs.environment }}** (managed=${{ inputs.managed }}). Review the schema diff before merging."
