# ============================================================
# deploy-prod.yml
# Promote the B2BAgg_Core solution into B2BAgg-Prod as a MANAGED solution.
#
# Trigger: manual (workflow_dispatch) — production ships on a deliberate human
# action. On a private repo on the Free plan, GitHub Environment "Required
# reviewers" are unavailable, so the manual run IS the approval gate (the
# operator clicks "Run workflow"). When the repo becomes public (or on a paid
# plan) a Required-reviewer rule on the `prod` environment can be added on top.
#
# Governance:
#   • Prod receives a MANAGED solution (no unmanaged customisations in Prod).
#
# Auth: GitHub OIDC + Microsoft Entra Federated Identity Credentials (FIC) —
# no client secret (P3 OIDC flip, audit M-3). Relies on the FIC `gh-env-prod`
# subject (repo:…:environment:prod) and the b2bagg-github-actions app user in
# B2BAgg-Prod.
#
# Required secrets:
#   PP_CLIENT_ID, PP_TENANT_ID, PP_PROD_URL
# ============================================================

name: Deploy → Prod

on:
  workflow_dispatch:
    # Manual approval gate: a maintainer triggers this from the Actions tab.

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never abort a production import mid-flight

permissions:
  id-token: write       # exchange the GitHub OIDC token for an Entra token (FIC)
  contents: read
  deployments: write

jobs:
  deploy:
    name: Pack (managed) & Import into Prod
    runs-on: ubuntu-latest

    environment:
      name: prod
      url: https://YOUR-PROD-ORG.crm.dynamics.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Pack as a MANAGED solution. Offline — no auth needed.
      - name: Pack MANAGED solution from source
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/B2BAgg.Core/src
          solution-file: /tmp/B2BAgg_Core_managed.zip
          solution-type: Managed

      # Import via the marketplace action: OIDC/FIC auth (app-id + tenant-id, no
      # secret), synchronous, force-overwrite.
      - name: Import managed solution into Prod (OIDC)
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.PP_PROD_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: /tmp/B2BAgg_Core_managed.zip
          force-overwrite: true
          activate-plugins: true
          run-asynchronously: false
