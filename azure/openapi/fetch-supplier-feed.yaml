swagger: "2.0"
x-ms-connector-name: FetchSupplierFeed

info:
  title: "B2BAgg Supplier Feed"
  version: "1.0"
  description: >
    Retrieves raw product feed data from B2B tire suppliers.
    Each supplier exposes a JSON array of tire listings including SKU,
    pricing, stock levels, and logistics metadata.
    Used by the B2B Market Intelligence & Supplier Aggregation Platform
    to ingest supplier data into Dataverse via Power Automate flows.

host: func-b2bagg-dev.azurewebsites.net
basePath: /api
schemes:
  - https

consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  apiKeyHeader:
    type: apiKey
    in: header
    name: x-functions-key
  apiKeyQuery:
    type: apiKey
    in: query
    name: code

security:
  - apiKeyHeader: []
  - apiKeyQuery: []

paths:
  /feed/{supplier_id}:
    get:
      operationId: GetSupplierFeed
      summary: Get supplier feed
      description: >
        Returns the supplier's RAW feed blob, unchanged. Feeds are deliberately
        heterogeneous (the whole point of the aggregator): rosshinaopt returns
        an English JSON wrapper { supplier_id, items[] }; tyrecenter-spb returns
        a Russian wrapper { postavschik, tovary[] }; koleso-ru returns
        { source, format, payload } with an XML catalog embedded as a string.
        The schema below documents the canonical English wrapper; the RU/XML
        variants are normalised downstream by the sync flow + sku_matcher.
        Supported supplier IDs: numeric keys 1, 2, 3 and slugs
        rosshinaopt, tyrecenter-spb, koleso-ru.
      x-ms-visibility: important
      parameters:
        - name: supplier_id
          in: path
          required: true
          type: string
          x-ms-summary: Supplier ID
          description: >
            Supplier identifier. Accepted values: numeric (1, 2, 3) or
            slug (rosshinaopt, tyrecenter-spb, koleso-ru).
      responses:
        "200":
          description: Raw supplier feed object returned successfully
          headers:
            X-Supplier-Id:
              type: string
              description: The resolved supplier identifier
            X-Container:
              type: string
              description: Azure Blob Storage container name used to source the feed
          schema:
            $ref: "#/definitions/SupplierFeed"
        "404":
          description: Supplier not found or feed file not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"

definitions:
  SupplierFeed:
    type: object
    description: >
      Raw supplier feed wrapper. This documents the canonical English variant
      (rosshinaopt). Other suppliers return native-language equivalents that
      are normalised downstream: tyrecenter-spb → { postavschik, versiya,
      data_sozdaniya, tovary[] }; koleso-ru → { source, format, payload } where
      payload is an XML <catalog> string. `additionalProperties` is allowed so
      the connector tolerates those variants without failing.
    additionalProperties: true
    properties:
      supplier_id:
        type: string
        description: Supplier slug echoed by the feed (e.g. rosshinaopt)
        x-ms-summary: Supplier ID
      schema_version:
        type: string
        description: Feed schema version stamped by the supplier
        x-ms-summary: Schema version
      generated_at:
        type: string
        description: ISO-8601 timestamp the feed was generated
        x-ms-summary: Generated at
      items:
        type: array
        description: Tire listings (canonical English variant)
        items:
          $ref: "#/definitions/FeedItem"

  FeedItem:
    type: object
    description: >
      A single tire listing in the canonical English feed. Field names are the
      supplier's own (raw) — normalisation to b2b_ columns happens in the flow.
    properties:
      product_name:
        type: string
        description: Raw free-text product name (e.g. "Michelin Pilot Sport 4 225/45R17")
        x-ms-summary: Product name
      sku:
        type: string
        description: Raw SKU / article number as provided by the supplier
        x-ms-summary: Raw SKU
      price_usd:
        type: number
        format: double
        description: Supplier price (this feed quotes USD)
        x-ms-summary: Price (USD)
      stock_qty:
        type: integer
        description: Available stock quantity in the supplier warehouse
        x-ms-summary: Stock quantity
      warehouse:
        type: string
        description: Warehouse city label (e.g. Moscow)
        x-ms-summary: Warehouse
      lead_days:
        type: integer
        description: Delivery lead time in days
        x-ms-summary: Lead days

  ErrorResponse:
    type: object
    description: Standard error envelope returned on 4xx / 5xx responses
    properties:
      error:
        type: string
        description: Human-readable error message
        x-ms-summary: Error message
      status:
        type: integer
        description: HTTP status code echoed in the response body
        x-ms-summary: Status code
